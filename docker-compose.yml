services:
  backend:
    build:
      context: ./backend
    image: caredesk-backend:1.0
    env_file:
      - ./backend/.env
    environment:
      DATABASE_PATH: /data/care.db
    volumes:
      - caredesk_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/dashboard', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    image: caredesk-frontend:1.0
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caredesk_data:
    external: true
    name: caredesk_data
